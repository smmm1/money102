services:
  - type: web
    runtime: static
    name: daytogether-phase2-preview
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_CLOUDFLARE_API_URL
        value: https://daytogether-api-staging.s2mtha16.workers.dev
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
