name: Quality checks

on:
  push:
    branches:
      - feature/cloudflare-d1-migration
  pull_request:
    branches:
      - feature/cloudflare-d1-migration

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build app
        run: npm run build
