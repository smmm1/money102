name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/d1-only-persistence]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test money calculations
        run: npm test
      - name: TypeScript check
        run: npm run check
      - name: Build application
        run: npm run build
