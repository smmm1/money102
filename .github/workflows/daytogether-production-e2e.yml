name: DayTogether Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daytogether-production-e2e
  cancel-in-progress: false

jobs:
  authenticated-e2e:
    name: Login and D1-backed Daily Log CRUD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify E2E credentials are configured
        shell: bash
        run: |
          test -n "$E2E_EMAIL" || { echo "::error::Add E2E_EMAIL to repository Actions secrets."; exit 1; }
          test -n "$E2E_PASSWORD" || { echo "::error::Add E2E_PASSWORD to repository Actions secrets."; exit 1; }
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated E2E against the PR frontend and production D1 API
        run: npx playwright test
